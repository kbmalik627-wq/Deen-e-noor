<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 340" width="100%" height="100%">
  <defs>
    <!-- Dark background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a08"/>
      <stop offset="50%" stop-color="#0a0f0d"/>
      <stop offset="100%" stop-color="#060907"/>
    </linearGradient>

    <!-- 3D Green Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="30%" stop-color="#22c55e"/>
      <stop offset="80%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Bevel light highlight -->
    <linearGradient id="bevelLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>

    <!-- Geometric Pattern -->
    <pattern id="islamicPattern" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M60 0 L120 60 L60 120 L0 60 Z" fill="none" stroke="#10b981" stroke-opacity="0.04" stroke-width="1.5"/>
      <circle cx="60" cy="60" r="30" fill="none" stroke="#10b981" stroke-opacity="0.03" stroke-width="1.5"/>
      <path d="M0 0 L60 60 L120 0 M0 120 L60 60 L120 120" fill="none" stroke="#10b981" stroke-opacity="0.03" stroke-width="1.5"/>
      <polygon points="60,20 75,45 100,60 75,75 60,100 45,75 20,60 45,45" fill="none" stroke="#10b981" stroke-opacity="0.05" stroke-width="1.2"/>
    </pattern>

    <!-- Subtle radial glow behind main text -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#15803d" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Deep 3D Shadow Filter -->
    <filter id="shadow3D" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.95"/>
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#022c22" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  
  <!-- Islamic geometric lattice overlay -->
  <rect width="100%" height="100%" fill="url(#islamicPattern)"/>

  <!-- Center green ambience glow -->
  <rect x="200" y="20" width="1200" height="300" fill="url(#centerGlow)"/>

  <!-- Top Right Badge #1 -->
  <g transform="translate(1480, 50)">
    <circle cx="0" cy="0" r="36" fill="#042f2e" stroke="#22c55e" stroke-width="3" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.8))"/>
    <circle cx="0" cy="0" r="30" fill="#064e3b" stroke="#4ade80" stroke-width="1.5"/>
    <text x="0" y="11" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      #1
    </text>
  </g>

  <!-- 3D Extrusion Shadow Layers for Main Text -->
  <g font-family="'Impact', 'Arial Black', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="76" text-anchor="middle" letter-spacing="3">
    <!-- Dark depth layers creating authentic 3D extrusion -->
    <text x="800" y="210" fill="#022c22" filter="url(#shadow3D)">KHATEEB MALIK DIGITAL EMPIRE</text>
    <text x="800" y="207" fill="#034226">KHATEEB MALIK DIGITAL EMPIRE</text>
    <text x="800" y="204" fill="#04562c">KHATEEB MALIK DIGITAL EMPIRE</text>
    <text x="800" y="201" fill="#065f46">KHATEEB MALIK DIGITAL EMPIRE</text>
    <text x="800" y="198" fill="#047857">KHATEEB MALIK DIGITAL EMPIRE</text>
    
    <!-- Top Face with Vibrant Green Gradient and Crisp Highlight Outline -->
    <text x="800" y="195" fill="url(#textGrad)" stroke="#86efac" stroke-width="1.8" stroke-linejoin="round">
      KHATEEB MALIK DIGITAL EMPIRE
    </text>
  </g>

  <!-- Phone Number below -->
  <text x="800" y="280" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="34" fill="#22c55e" text-anchor="middle" letter-spacing="5" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.9))">
    0326 797 6823
  </text>
</svg>
